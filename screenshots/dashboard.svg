  <text x="150" y="220" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">总服务数</text>
  
  <rect x="280" y="150" width="200" height="100" rx="8" fill="white" stroke="#e8e8e8" stroke-width="1"/>
  <text x="380" y="190" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#52c41a" text-anchor="middle">7</text>
  <text x="380" y="220" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">健康运行</text>
  
  <rect x="510" y="150" width="200" height="100" rx="8" fill="white" stroke="#e8e8e8" stroke-width="1"/>
  <text x="610" y="190" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#faad14" text-anchor="middle">0</text>
  <text x="610" y="220" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">运行异常</text>
  
  <rect x="740" y="150" width="200" height="100" rx="8" fill="white" stroke="#e8e8e8" stroke-width="1"/>
  <text x="840" y="190" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ff4d4f" text-anchor="middle">0</text>
  <text x="840" y="220" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">已停止</text>
  
