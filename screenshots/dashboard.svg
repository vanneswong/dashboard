  <text x="730" y="335" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="end">端口: 10000</text>
  <text x="450" y="380" font-family="Arial, sans-serif" font-size="14" fill="#666">访问权限</text>
  <text x="730" y="380" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="end">局域网</text>
  <text x="450" y="410" font-family="Arial, sans-serif" font-size="14" fill="#666">运行状态</text>
  <text x="730" y="410" font-family="Arial, sans-serif" font-size="14" fill="#52c41a" text-anchor="end">健康</text>
  <text x="450" y="450" font-family="Arial, sans-serif" font-size="13" fill="#666">服务监控面板，展示本机部署的所有服务</text>
  
  <rect x="810" y="300" width="350" height="200" rx="8" fill="white" stroke="#e8e8e8" stroke-width="1"/>
