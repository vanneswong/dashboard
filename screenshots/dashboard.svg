  <text x="1110" y="335" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="end">端口: 10002</text>
  <text x="830" y="380" font-family="Arial, sans-serif" font-size="14" fill="#666">访问权限</text>
  <text x="1110" y="380" font-family="Arial, sans-serif" font-size="14" fill="#1890ff" text-anchor="end">局域网</text>
  <text x="830" y="410" font-family="Arial, sans-serif" font-size="14" fill="#666">运行状态</text>
  <text x="1110" y="410" font-family="Arial, sans-serif" font-size="14" fill="#52c41a" text-anchor="end">健康</text>
  <text x="830" y="450" font-family="Arial, sans-serif" font-size="13" fill="#666">系统信息监控服务</text>
  
  <!-- 底部信息 -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="14" fill="#999" text-anchor="middle">服务仪表盘 v3.7 · 更新于 2024年09月23日 12:00 · 服务器: 192.168.10.98</text>
