  <text x="1070" y="190" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1890ff" text-anchor="middle">100%</text>
  <text x="1070" y="220" font-family="Arial, sans-serif" font-size="14" fill="#666" text-anchor="middle">健康率</text>
  
